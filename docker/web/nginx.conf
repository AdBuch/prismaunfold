# Serves the built frontend and, under /api/, the pipeline's static JSON from /site.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The page loads only its own script, style and data. No third parties, no trackers.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        root /site;
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # A missing asset is a 404, not the app shell.
    location ~* \.(js|css|map|svg|png|jpg|ico|json|txt)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes (/story/..., /edition/...) all load the app shell.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
