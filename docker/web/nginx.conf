# Serves the pipeline's static JSON. The Angular frontend will be added to this image later.
server {
    listen 8080;
    server_name _;
    root /site;

    add_header X-Content-Type-Options nosniff always;

    location = / {
        default_type text/plain;
        return 200 "PrismUnfold API. Start at /api/v1/index.json\n";
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        default_type application/json;
        charset utf-8;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
