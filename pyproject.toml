[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismunfold"
version = "0.1.0"
description = "PrismUnfold MVP: evidence-linked, slow-news editions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prismunfold = "prismunfold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
